server:
  port: 8080

spring:
  application:
    name: voyagecraft-orchestrator
  datasource:
    url: jdbc:h2:mem:voyagecraftdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jackson:
    serialization:
      indent-output: true

voyagecraft:
  jwt:
    secret: "VoyageCraftTravelGroupPS030SecretKeySuperSecureKey2026WithSufficientByteLengthForHMAC256"
    expiration-ms: 28800000 # 8 hours
  eureka:
    server-url: "http://localhost:8761/eureka"
  gateway:
    default-rate-limit-per-min: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,eureka
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.voyagecraft: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
